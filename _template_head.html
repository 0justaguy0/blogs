<!DOCTYPE html>
<html lang="__LANG__">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__TITLE__</title>
    <style>
        :root {
            --bg-color: #FDF9F1;
            --text-color: #3E2723;
            --indian-yellow: #E4A025;
            --indian-orange: #E65100;
            --accent-light: #FFECB3;
            --ref-bg: #FFF3E0;
        }

        body {
            font-family: 'Georgia', 'Nirmala UI', 'Mangal', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(var(--bg-color) 80%, var(--accent-light) 100%);
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: #FFFFFF;
            padding: 50px 60px;
            box-shadow: 0 10px 30px rgba(62, 39, 35, 0.1);
            border-top: 8px solid var(--indian-orange);
            border-bottom: 8px solid var(--indian-yellow);
            border-radius: 4px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--indian-yellow);
        }

        h1 {
            color: var(--indian-orange);
            font-size: 2.5em;
            line-height: 1.2;
            margin-bottom: 15px;
            font-family: 'Palatino Linotype', 'Book Antiqua', 'Nirmala UI', 'Mangal', Palatino, serif;
        }

        h2 {
            color: var(--indian-yellow);
            font-size: 1.8em;
            margin-top: 40px;
            margin-bottom: 20px;
            border-left: 5px solid var(--indian-orange);
            padding-left: 15px;
        }

        h3, h4 {
            color: var(--indian-orange);
            margin-top: 30px;
            margin-bottom: 15px;
            font-family: 'Palatino Linotype', 'Book Antiqua', 'Nirmala UI', 'Mangal', Palatino, serif;
        }

        .intro-text::first-letter {
            float: left;
            font-size: 3.5em;
            line-height: 0.8;
            padding-right: 8px;
            padding-top: 4px;
            color: var(--indian-orange);
            font-weight: bold;
        }

        p {
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        ul, ol {
            margin: 0 0 24px 0;
            padding-left: 0;
        }

        ul {
            list-style: none;
        }

        ol {
            list-style-position: outside;
            padding-left: 2.2em;
        }

        ul li, ol li {
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        ul li {
            position: relative;
            padding-left: 30px;
        }

        ol li {
            padding-left: 0.35em;
        }

        ul li::before {
            content: '\2022';
            position: absolute;
            left: 0;
            top: 0.05em;
            color: var(--indian-orange);
            font-size: 1.2em;
            line-height: 1;
        }

        ol li::marker {
            color: var(--indian-orange);
            font-weight: bold;
        }

        strong {
            color: var(--indian-orange);
        }

        .image-placeholder-container {
            margin: 30px 0;
            text-align: center;
            font-style: italic;
            color: #795548;
            background-color: var(--accent-light);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid var(--indian-yellow);
        }

        img {
            width: 100%;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 0.98em;
            background-color: #FFFDF8;
        }

        th, td {
            border: 1px solid #F0D49B;
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: var(--ref-bg);
            color: var(--indian-orange);
        }

        blockquote {
            margin: 30px 0;
            padding: 20px 25px;
            background-color: var(--accent-light);
            border-left: 5px solid var(--indian-orange);
            font-style: italic;
        }

        hr {
            border: 0;
            border-top: 1px dashed var(--indian-yellow);
            margin: 32px 0;
        }

        .references {
            margin-top: 50px;
            padding: 30px;
            background-color: var(--ref-bg);
            border-radius: 8px;
            font-size: 0.9em;
        }

        .references h2, .references h3 {
            color: var(--text-color);
            margin-top: 0;
            border-bottom: 1px solid var(--indian-yellow);
            padding-bottom: 10px;
            border-left: 0;
            padding-left: 0;
        }

        .references p, .references li {
            margin-bottom: 12px;
            word-wrap: break-word;
        }

        .references a {
            color: var(--indian-orange);
            text-decoration: none;
        }

        .references a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }
            h1 {
                font-size: 2em;
            }
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
